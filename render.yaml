# Render Blueprint — New > Blueprint in the dashboard, then point it at this repo.
# Postgres stays on Supabase. Do not add a Render database here.
# DATABASE_URL must be the session pooler URI (aws-0-….pooler.supabase.com),
# not the direct db.<ref>.supabase.co host.
services:
  - type: web
    name: bricksplaza
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render-com
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
