# Render Blueprint. Postgres stays on Supabase — this file does not create a database.
# DATABASE_URL must be the session pooler URI (host contains pooler.supabase.com).
services:
  - type: web
    name: bricksplaza
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    # Vite and Nitro are devDependencies. Render sets NODE_ENV=production, which
    # would otherwise skip them and fail the build with "vite: not found".
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Public origin used in OAuth callbacks. Set this to the live site
      # (https://bricksplaza.co.za or the onrender.com host). Leave unset to
      # use RENDER_EXTERNAL_URL.
      - key: BETTER_AUTH_URL
        sync: false
      # Each app must be named Bricksplaza in that provider's console. The
      # permission screen uses that registered name — it cannot be overridden
      # in code. Callbacks are {BETTER_AUTH_URL}/api/auth/callback/<provider>
      # except Instagram, which is /api/auth/oauth2/callback/instagram.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      # Customer mail. Leave RESEND_API_KEY empty and messages stay queued in outbound_mail.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Printed on the EFT pro forma and the order email. Leave blank until the account exists.
      - key: EFT_BANK
        sync: false
      - key: EFT_ACCOUNT_NUMBER
        sync: false
      - key: EFT_BRANCH_CODE
        sync: false
